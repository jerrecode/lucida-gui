name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/checkout@v4
        with:
          repository: jerrecode/lucida-api
          path: api-dependency
      - run: python -m pip install -e api-dependency
      - name: Install Qt shared libraries for headless Linux smoke tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0
      - run: python -m pip install "PySide6>=6.6,<7" pytest
      - run: python -m pip install -e . --no-deps
      - run: python -m pip check
      - run: python -m compileall -q src
      - run: python -m pytest -q
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Linux source installer and Qt smoke
        if: runner.os == 'Linux'
        run: |
          LUCIDA_API_SOURCE=api-dependency bash ./install.sh
          QT_QPA_PLATFORM=offscreen ./.venv/bin/lucida-gui --smoke
      - name: Windows PowerShell installer and Qt smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:LUCIDA_API_SOURCE = (Resolve-Path api-dependency).Path
          .\install.ps1
          $env:QT_QPA_PLATFORM = 'offscreen'
          & .\.venv\Scripts\lucida-gui.exe --smoke

