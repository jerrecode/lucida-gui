[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lucida-gui-app"
version = "0.1.0"
description = "Qt 6 desktop frontend for Lucida API"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["lucida-api-core>=0.1.0,<0.2.0", "PySide6>=6.6,<7"]

[project.scripts]
lucida-gui = "lucida_gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
